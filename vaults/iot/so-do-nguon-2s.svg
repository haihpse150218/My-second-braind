<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1180" height="660" fill="#ffffff"/>
<text x="590.0" y="28" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">NullPet — nguồn pin LiPo 2S → 8 servo MG90S (5 V) và logic ESP32-S3 (5 V → 3,3 V)</text>
<text x="590.0" y="48" font-size="12" fill="#555" text-anchor="middle">Hai rail tách riêng · GND chung · diode chống cắm ngược · tụ đệm sát servo · chia áp đo pin</text>
<rect x="30" y="62" width="400" height="128" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="45" y="82" font-size="13" fill="#111" text-anchor="start" font-weight="bold">Vì sao</text>
<text x="45" y="102" font-size="11" fill="#111" text-anchor="start">• 7,4–8,4 V thẳng vào MG90S (max 6 V) hoặc chân 5V board = hỏng → buck</text>
<text x="45" y="118" font-size="11" fill="#111" text-anchor="start">• LDO 7805 ở 2 A toả (7,4−5)×2 ≈ 5 W → dùng buck, không LDO</text>
<text x="45" y="134" font-size="11" fill="#111" text-anchor="start">• 8 servo kẹt đồng loạt hút 5–8 A → rail riêng + tụ, tránh ESP32 reset</text>
<text x="45" y="150" font-size="11" fill="#111" text-anchor="start">• Diode: dòng chỉ đi A → K; cắm ngược pin thì chặn</text>
<text x="45" y="166" font-size="11" fill="#111" text-anchor="start">• ADC 3,3 V không chịu 8,4 V → luôn qua cầu chia áp</text>
<text x="45" y="182" font-size="11" fill="#111" text-anchor="start">• Không có GND chung thì xung PWM 'lơ lửng', servo quay loạn</text>
<rect x="30" y="215" width="130" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="95.0" y="237" text-anchor="middle" font-weight="bold" font-size="14">Pin LiPo 2S</text>
<text x="95.0" y="257" text-anchor="middle" font-size="12" fill="#444">7,4 V danh định</text>
<text x="95.0" y="273" text-anchor="middle" font-size="12" fill="#444">6,0 – 8,4 V</text>
<text x="95.0" y="289" text-anchor="middle" font-size="12" fill="#444">2 cell nối tiếp</text>
<text x="165" y="231" font-size="16" fill="#dc2626" text-anchor="start" font-weight="bold">+</text>
<text x="165" y="301" font-size="16" fill="#111" text-anchor="start" font-weight="bold">−</text>
<text x="178" y="318" font-size="11" fill="#dc2626" text-anchor="start" font-weight="bold">dây đỏ = + → anode</text>
<text x="178" y="332" font-size="11" fill="#111" text-anchor="start" font-weight="bold">dây đen = − → cathode / GND</text>
<line x1="160" y1="235" x2="200" y2="235" stroke="#dc2626" stroke-width="3"/>
<rect x="200" y="223" width="70" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="235.0" y="239" font-size="11" fill="#111" text-anchor="middle">Cầu chì 10 A</text>
<line x1="270" y1="235" x2="300" y2="235" stroke="#dc2626" stroke-width="3"/>
<rect x="300" y="223" width="44" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="322.0" y="239" font-size="11" fill="#111" text-anchor="middle">SW</text>
<line x1="344" y1="235" x2="380" y2="235" stroke="#dc2626" stroke-width="3"/>
<polygon points="380,224 380,246 400,235" fill="#111"/>
<line x1="400" y1="224" x2="400" y2="246" stroke="#111" stroke-width="3"/>
