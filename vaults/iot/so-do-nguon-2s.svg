<text x="406" y="221" font-size="11" fill="#111" text-anchor="start" font-weight="bold">K</text>
<line x1="400" y1="235" x2="470" y2="235" stroke="#dc2626" stroke-width="3"/>
<text x="385" y="267" font-size="11" fill="#111" text-anchor="start">D1 Schottky SS54 (5 A)</text>
<text x="385" y="281" font-size="11" fill="#555" text-anchor="start">chống cắm ngược</text>
<line x1="470" y1="150" x2="470" y2="470" stroke="#dc2626" stroke-width="3"/>
<text x="470" y="140" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">VBAT 6 – 8,4 V</text>
<circle cx="470" cy="235" r="4" fill="#dc2626"/>
<line x1="470" y1="170" x2="540" y2="170" stroke="#dc2626" stroke-width="3" marker-end="url(#arr)"/>
