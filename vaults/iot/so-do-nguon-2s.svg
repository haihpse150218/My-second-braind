<rect x="905" y="120" width="190" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1000.0" y="142" text-anchor="middle" font-weight="bold" font-size="14">8 × Servo MG90S</text>
<text x="1000.0" y="162" text-anchor="middle" font-size="12" fill="#444">4,8–6 V · ~0,2 A chạy</text>
<text x="1000.0" y="178" text-anchor="middle" font-size="12" fill="#444">0,7–1 A kẹt mỗi con</text>
<text x="1000.0" y="194" text-anchor="middle" font-size="12" fill="#444">2 servo / chân × 4 chân</text>
<line x1="470" y1="300" x2="540" y2="300" stroke="#dc2626" stroke-width="3" marker-end="url(#arr)"/>
<rect x="545" y="260" width="170" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="630.0" y="282" text-anchor="middle" font-weight="bold" font-size="14">Buck 2</text>
<text x="630.0" y="302" text-anchor="middle" font-size="12" fill="#444">5 V / 1 A</text>
<text x="630.0" y="318" text-anchor="middle" font-size="12" fill="#444">rail logic tách riêng</text>
<line x1="715" y1="300" x2="900" y2="300" stroke="#16a34a" stroke-width="3" marker-end="url(#arr)"/>
<text x="722" y="290" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold">5 V vào chân VBUS/5V</text>
<rect x="905" y="250" width="190" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="1000.0" y="272" text-anchor="middle" font-weight="bold" font-size="14">LOLIN S3 Mini (ESP32-S3)</text>
<text x="1000.0" y="292" text-anchor="middle" font-size="12" fill="#444">LDO trên board → 3,3 V</text>
<text x="1000.0" y="308" text-anchor="middle" font-size="12" fill="#444">GPIO mức 3,3 V</text>
<text x="1000.0" y="324" text-anchor="middle" font-size="12" fill="#444">ADC 12-bit, ≤ 3,3 V</text>
<text x="1000.0" y="340" text-anchor="middle" font-size="12" fill="#444">Wi-Fi đỉnh ~400 mA</text>
<line x1="1000" y1="250" x2="1000" y2="220" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="1008" y="238" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold">8 × GPIO PWM 50 Hz (3,3 V) → SIG</text>
