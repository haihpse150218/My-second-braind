<text x="630.0" y="172" text-anchor="middle" font-size="12" fill="#444">5 V / 5–8 A (hoặc 2 × 3 A)</text>
<text x="630.0" y="188" text-anchor="middle" font-size="12" fill="#444">hạ 7,4 → 5 V, ~90 %</text>
